[pytest]
# 缓存目录 - 指定到resources目录（配置文件的上一级）
cache_dir = ../.pytest_cache

# 测试文件匹配模式 (P2-11: rootdir=config/, testpaths 指回项目根 tests)
testpaths = ../tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 递归排除 (electron/templates 的 test_case_template.py 是模板非测试, 防止默认扫描误收集)
norecursedirs =
    node_modules
    .venv
    dist
    out
    electron/templates
    electron/node_modules

# 命令行选项
# P2-11: --alluredir 已移除 — 与 args_builder.py 追加的绝对 --alluredir 重复,
# 统一由 args_builder 提供 (运行期), 裸 pytest 不再隐式写相对路径报告
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --color=yes

# 标记定义
markers =
    smoke: 冒烟测试
    unit: 单元功能测试
    exception: 异常场景测试
    critical: 关键功能测试
    appium: Appium移动端测试

# 日志配置
# log_cli 已删除: -p no:logging (args_builder.py) 禁用整个 logging 插件,
# 不再识别 log_cli 选项。测试代码 logger 通过 root logger console_handler 实时写 stderr,
# PytestProcess 转发到父进程。

# 测试报告
junit_family = xunit2

# 禁用警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning