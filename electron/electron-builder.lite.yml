appId: com.ring.xkautotester
productName: XKAutoTester
artifactName: ${productName} Lite Setup v${version}.${ext}

directories:
  output: dist

files:
  - src/**/*
  - splash.html
  - renderer/**/*
  - assets/**/*
  - locales/**/*
  - templates/**/*
  - node_modules/**/*

asar: true

asarUnpack:
  - src/preload/**/*

extraResources:
  - from: ../src
    to: src
    filter:
      - "**/*.py"
      - "**/*.json"
  - from: ../config/pytest.ini
    to: config/pytest.ini
  - from: ../pyproject.toml
    to: pyproject.toml
  - from: ../uv.lock
    to: uv.lock
  - from: ../version.json
    to: version.json

win:
  target: nsis
  icon: assets/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  multiLanguageInstaller: true
  displayLanguageSelector: true
  installerLanguages:
    - zh_CN
    - en_US
  installerSidebar: assets/installerSidebar.bmp
  uninstallerSidebar: assets/installerSidebar.bmp
