<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XKAutoTester - 启动中</title>

    <style>
        /* 引入HarmonyOS Sans SC Regular字体 */
        @font-face {
            font-family: 'HarmonyOS Sans';
            src: url('assets/fonts/HarmonyOS_Sans_SC_Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'HarmonyOS Sans', sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            color: #333;
            overflow: hidden;
            user-select: none; /* 禁止选择页面文字 */
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-app-region: drag;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-app-region: no-drag;
        }
        
        /* 深色主题 */
        body.dark-theme {
            background: transparent;
            color: #FFFFFF;
        }
        
        .splash-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 6px 12px rgba(128, 128, 128, 0.12), 0 3px 6px rgba(128, 128, 128, 0.08);
            padding: 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
            min-height: 350px;
            overflow-y: auto;
            position: relative;
            user-select: none; /* 禁止选择容器内文字 */
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        /* 深色主题下的容器样式 */
        body.dark-theme .splash-container {
            background: #1E1E1E;
            box-shadow: 0 6px 12px rgba(128, 128, 128, 0.12), 0 3px 6px rgba(128, 128, 128, 0.08);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            object-fit: cover;
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.15)) drop-shadow(0 4px 12px rgba(0, 0, 0, 0.1));
            transition: all 0.3s ease;
            background: transparent;
        }
        
        .logo:hover {
            filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.2)) drop-shadow(0 6px 16px rgba(0, 0, 0, 0.15));
            transform: translateY(-2px);
        }
        
        h1 {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 10px;
            color: #333;
            user-select: none; /* 禁止选择标题文字 */
            transition: color 0.3s ease;
        }
        
        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
            user-select: none; /* 禁止选择副标题文字 */
            transition: color 0.3s ease;
        }
        
        .progress-container {
            margin: 30px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
            transition: background-color 0.3s ease;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            font-size: 14px;
            color: #666;
            user-select: none; /* 禁止选择进度文字 */
            transition: color 0.3s ease;
        }
        
        /* 深色主题下的文本和进度条样式 */
        body.dark-theme h1 {
            color: #FFFFFF;
        }
        
        body.dark-theme .subtitle {
            color: #B0B0B0;
        }
        
        body.dark-theme .progress-bar {
            background: #333333;
        }
        
        body.dark-theme .progress-text {
            color: #B0B0B0;
        }
        
        /* 深色主题下的检查项样式 */
        body.dark-theme .check-text {
            color: #FFFFFF;
        }
        
        body.dark-theme .check-status {
            color: #B0B0B0;
        }
        
        /* 深色主题下的检查项状态颜色 */
        body.dark-theme .check-icon.success {
            color: #4caf50;
        }
        
        body.dark-theme .check-icon.warning {
            color: #ff9800;
        }
        
        body.dark-theme .check-icon.error {
            color: #f44336;
        }
        
        body.dark-theme .check-status.success {
            color: #4caf50;
        }
        
        body.dark-theme .check-status.warning {
            color: #ff9800;
        }
        
        body.dark-theme .check-status.error {
            color: #f44336;
        }
        

        
        .checks-container {
            margin-top: 30px;
            text-align: left;
        }
        
        .check-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            user-select: none; /* 禁止选择检查项文字 */
        }
        
        .check-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .check-icon.success {
            color: #4caf50;
        }
        
        .check-icon.warning {
            color: #ff9800;
        }
        
        .check-icon.error {
            color: #f44336;
        }
        
        .check-text {
            flex: 1;
        }
        
        .check-status {
            font-weight: 500;
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
            vertical-align: middle;
        }
        
        .check-status.success {
            color: #4caf50;
        }
        
        .check-status.warning {
            color: #ff9800;
        }
        
        .check-status.error {
            color: #f44336;
        }
        
        /* 禁止所有元素被选择 */
        * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        /* 允许title属性正常显示 */
        .check-status {
            user-select: none;
            pointer-events: auto;
        }
        
        .error-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .error-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            text-align: left;
        }
        
        .error-content h2 {
            color: #f44336;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        .error-content p {
            margin-bottom: 20px;
            color: #666;
        }
        
        .error-content ul {
            margin-bottom: 20px;
            padding-left: 20px;
        }
        
        .error-content li {
            margin-bottom: 8px;
            color: #666;
        }
        
        .button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .button:hover {
            transform: translateY(-2px);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        @media (max-width: 768px) {
            .splash-container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-container">
            <img src="assets/icon.png" alt="Logo" class="logo">
        </div>
        <h1>XKAutoTester</h1>
        <p class="subtitle">自动化测试工具</p>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">准备中...</div>
        </div>
        
        <div class="checks-container" id="checksContainer">
            <!-- 检查项将通过JavaScript动态添加 -->
        </div>
        
        <div class="actions-container" id="actionsContainer" style="display: none; margin-top: 30px; text-align: center;">
            <button class="button" id="enterButton" onclick="enterMainApp()" style="margin-right: 12px;">进入程序</button>
            <button class="button" id="exitButton" onclick="exitApp()">退出程序</button>
        </div>
    </div>
    
    <script>
        const { ipcRenderer } = require('electron');
        
        // 环境检查结果
        let checkResults = {
            required: [],
            warnings: []
        };
        
        // 更新进度条
        function updateProgress(percentage, text) {
            document.getElementById('progressFill').style.width = `${percentage}%`;
            document.getElementById('progressText').textContent = text;
        }
        
        // 添加检查项
        function addCheckItem(name, status, message) {
            const container = document.getElementById('checksContainer');
            const checkItem = document.createElement('div');
            checkItem.className = 'check-item';
            
            let icon, statusClass;
            switch (status) {
                case 'success':
                    icon = '✓';
                    statusClass = 'success';
                    break;
                case 'warning':
                    icon = '⚠';
                    statusClass = 'warning';
                    break;
                case 'error':
                    icon = '✗';
                    statusClass = 'error';
                    break;
            }
            
            // 创建状态元素并添加title属性
            const statusElement = document.createElement('div');
            statusElement.className = `check-status ${statusClass}`;
            statusElement.textContent = message;
            statusElement.title = message; // 添加title属性以显示完整内容
            
            // 创建其他元素
            const iconElement = document.createElement('div');
            iconElement.className = `check-icon ${statusClass}`;
            iconElement.textContent = icon;
            
            const textElement = document.createElement('div');
            textElement.className = 'check-text';
            textElement.textContent = name;
            
            // 组装checkItem
            checkItem.appendChild(iconElement);
            checkItem.appendChild(textElement);
            checkItem.appendChild(statusElement);
            
            container.appendChild(checkItem);
        }
        
        // 进入主程序
        function enterMainApp() {
            ipcRenderer.send('splash-ready');
        }
        
        // 退出程序
        function exitApp() {
            window.close();
        }
        
        // 显示操作按钮
        function showActionButtons(canEnter) {
            const actionsContainer = document.getElementById('actionsContainer');
            const enterButton = document.getElementById('enterButton');
            const exitButton = document.getElementById('exitButton');
            
            if (canEnter) {
                enterButton.style.display = 'inline-block';
                exitButton.style.display = 'inline-block';
            } else {
                enterButton.style.display = 'none';
                exitButton.style.display = 'inline-block';
            }
            
            actionsContainer.style.display = 'flex';
            actionsContainer.style.justifyContent = 'center';
            actionsContainer.style.gap = '12px';
            actionsContainer.style.marginTop = '20px';
        }
        
        // 应用黑暗模式
        function applyDarkMode(isDark) {
            if (isDark) {
                document.body.classList.add('dark-theme');
            } else {
                document.body.classList.remove('dark-theme');
            }
        }
        
        // 加载配置并应用主题
        async function loadConfigAndApplyTheme() {
            try {
                // 发送获取配置的请求（使用invoke而不是send）
                const config = await ipcRenderer.invoke('get-config');
                
                // 应用黑暗模式
                const isDark = config?.APP_SETTINGS?.dark_mode || false;
                applyDarkMode(isDark);
                
                // 应用主题色
                const themeColor = config?.APP_SETTINGS?.theme_color || '#4CAF50';
                applyThemeColor(themeColor);
            } catch (error) {
                console.error('加载配置失败:', error);
                // 默认为亮色主题和默认主题色
                applyDarkMode(false);
                applyThemeColor('#4CAF50');
            }
        }
        
        // 应用主题色到UI元素
        function applyThemeColor(color) {
            // 应用到进度条
            const progressFill = document.getElementById('progressFill');
            if (progressFill) {
                // 计算亮色作为渐变的另一部分
                const lightColor = lightenColor(color, 0.3);
                progressFill.style.background = `linear-gradient(90deg, ${color}, ${lightColor})`;
            }
            
            // 应用到按钮
            const buttons = document.querySelectorAll('.button');
            buttons.forEach(button => {
                // 计算暗色作为渐变的另一部分
                const darkColor = darkenColor(color, 0.2);
                button.style.background = `linear-gradient(135deg, ${color}, ${darkColor})`;
                button.style.boxShadow = `0 4px 14px rgba(${hexToRgb(color)}, 0.4)`;
            });
            
            // 应用到卡片阴影
            const splashContainer = document.querySelector('.splash-container');
            if (splashContainer) {
                const isDarkMode = document.body.classList.contains('dark-theme');
                if (isDarkMode) {
                    // 暗黑模式下使用主题色
                    splashContainer.style.boxShadow = `0 6px 12px rgba(${hexToRgb(color)}, 0.12), 0 3px 6px rgba(${hexToRgb(color)}, 0.08)`;
                } else {
                    // 普通模式下使用#808080
                    splashContainer.style.boxShadow = `0 6px 12px rgba(128, 128, 128, 0.12), 0 3px 6px rgba(128, 128, 128, 0.08)`;
                }
            }
        }
        
        // 计算亮色
        function lightenColor(color, amount) {
            color = color.replace('#', '');
            let r = parseInt(color.substring(0, 2), 16);
            let g = parseInt(color.substring(2, 4), 16);
            let b = parseInt(color.substring(4, 6), 16);
            
            r = Math.min(255, Math.floor(r + (255 - r) * amount));
            g = Math.min(255, Math.floor(g + (255 - g) * amount));
            b = Math.min(255, Math.floor(b + (255 - b) * amount));
            
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }
        
        // 计算暗色
        function darkenColor(color, amount) {
            color = color.replace('#', '');
            let r = parseInt(color.substring(0, 2), 16);
            let g = parseInt(color.substring(2, 4), 16);
            let b = parseInt(color.substring(4, 6), 16);
            
            r = Math.max(0, Math.floor(r * (1 - amount)));
            g = Math.max(0, Math.floor(g * (1 - amount)));
            b = Math.max(0, Math.floor(b * (1 - amount)));
            
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }
        
        // HEX颜色转RGB
        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            return `${r}, ${g}, ${b}`;
        }
        
        // 初始化检查
        async function initChecks() {
            // 先加载配置并应用主题
            await loadConfigAndApplyTheme();
            
            updateProgress(0, '开始环境检查...');
            
            // 监听主进程的检查结果
            ipcRenderer.on('check-result', (event, data) => {
                const { name, status, message, isRequired } = data;
                
                addCheckItem(name, status, message);
                
                if (status === 'error') {
                    if (isRequired) {
                        checkResults.required.push(`${name}: ${message}`);
                    } else {
                        checkResults.warnings.push(`${name}: ${message}`);
                    }
                } else if (status === 'warning') {
                    checkResults.warnings.push(`${name}: ${message}`);
                }
            });
            
            ipcRenderer.on('check-progress', (event, data) => {
                updateProgress(data.percentage, data.message);
            });
            
            ipcRenderer.on('check-complete', (event, data) => {
                const { requiredErrors, warnings } = data;
                updateProgress(100, '环境检查完成');
                
                // 显示操作按钮
                const canEnter = requiredErrors.length === 0;
                showActionButtons(canEnter);
            });
            
            // 开始检查
            ipcRenderer.send('start-checks');
        }
        
        // 页面加载完成后开始检查
        window.onload = initChecks;
    </script>
</body>
</html>
