<div id="confirm-modal-overlay" class="modal-overlay hidden">
    <div class="modal-container confirm-modal">
        <div class="modal-header">
            <span class="svg-icon confirm-icon" data-icon="warning"></span>
            <h3 id="confirm-modal-title">确认</h3>
        </div>
        <div class="modal-content">
            <p id="confirm-modal-message" class="confirm-message">确定要执行此操作吗？</p>
        </div>
        <div class="modal-footer">
            <button type="button" id="confirm-modal-cancel-btn" class="material-button outlined" data-i18n="modal.cancel">取消</button>
            <button type="button" id="confirm-modal-confirm-btn" class="material-button error" data-i18n="modal.confirmBtn">确认</button>
        </div>
    </div>
</div>
