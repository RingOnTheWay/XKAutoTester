[pytest]
# 测试文件匹配模式
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行选项
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    --alluredir=allure-results

# 标记定义
markers =
    smoke: 冒烟测试
    unit: 单元功能测试
    exception: 异常场景测试
    critical: 关键功能测试
    appium: Appium移动端测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 测试报告
junit_family = xunit2

# 禁用警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning